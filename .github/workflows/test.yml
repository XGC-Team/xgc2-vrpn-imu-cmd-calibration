name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install numpy pyyaml
      - run: PYTHONPATH=src python -m unittest discover -s test -v
